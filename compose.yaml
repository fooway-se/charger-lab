services:
  app:
    build: .
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/router.php"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATA_PATH: /app/data/emulator.sqlite
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - charger-data:/app/data
    depends_on:
      - mock-csms
      - station-worker

  station-worker:
    build: .
    command: ["php", "bin/station-worker.php"]
    environment:
      DATA_PATH: /app/data/emulator.sqlite
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - charger-data:/app/data
    depends_on:
      - mock-csms

  mock-csms:
    build: .
    command: ["php", "bin/mock-csms.php"]
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      default:
        aliases:
          - fake-csms

volumes:
  charger-data:
